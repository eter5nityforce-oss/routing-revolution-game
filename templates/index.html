<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing Revolution Game</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #333; color: white; padding: 10px; display: flex; justify-content: space-between; }
        #main { display: flex; flex: 1; }
        #sidebar { width: 250px; background: #f4f4f4; padding: 10px; border-right: 1px solid #ccc; overflow-y: auto; }
        #network-container { flex: 1; position: relative; }
        #network { width: 100%; height: 100%; }
        .stat-box { margin-bottom: 10px; padding: 10px; background: white; border: 1px solid #ddd; }
        button { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; }
        input, select { width: 100%; padding: 5px; margin-top: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="header">
        <div>Routing Revolution</div>
        <div id="game-stats">Money: $1000 | Time: 0s | State: RUNNING</div>
    </div>
    <div id="main">
        <div id="sidebar">
            <div class="stat-box">
                <h3>Controls</h3>
                <button onclick="controlGame('pause')">Pause</button>
                <button onclick="controlGame('resume')">Resume</button>
                <button onclick="controlGame('reset')">Reset</button>
            </div>

            <div class="stat-box">
                <h3>Add Node</h3>
                <input type="text" id="node-id" placeholder="Node ID">
                <select id="node-type">
                    <option value="ROUTER">Router</option>
                    <option value="ENDPOINT">Endpoint</option>
                    <option value="SERVER">Server</option>
                </select>
                <button onclick="addNode()">Add Node</button>
            </div>

            <div class="stat-box">
                <h3>Add Link</h3>
                <input type="text" id="link-src" placeholder="Source ID">
                <input type="text" id="link-dst" placeholder="Dest ID">
                <button onclick="addLink()">Add Link</button>
            </div>

            <div class="stat-box">
                <h3>Traffic</h3>
                <input type="text" id="traffic-src" placeholder="Source ID">
                <input type="text" id="traffic-dst" placeholder="Dest ID">
                <button onclick="generateTraffic()">Send Packets</button>
            </div>

             <div class="stat-box">
                <h3>Metrics</h3>
                <div>Delivered: <span id="stat-delivered">0</span></div>
                <div>Dropped: <span id="stat-dropped">0</span></div>
            </div>
        </div>
        <div id="network-container">
            <div id="network"></div>
        </div>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
